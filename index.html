<style>
:root {
--bg: #F2F5FA; --surface: #FFFFFF; --ink: #16213A; --muted: #5C6884; --line: #DDE3EF;

--bg: #0E1424; --surface: #172038; --ink: #EAF0FF; --muted: #9AA7C7; --line: #27324F;
--mil: #4CD27E; --on-mil: #05210F; --mil-soft: #123A24; --teo: #F5CB3D; --teo-soft: #46391A; --danger: #FF8A75;

​{ box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.4; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
.wrap, .narrow { max-width: 640px; margin: 0 auto; padding: 16px; }
.wrap { padding-bottom: 110px; }
.narrow { max-width: 440px; padding-top: 40px; }
header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
.brand { display: flex; align-items: center; gap: 10px; }
.word { font-family: var(--font-display); font-weight: 700; font-size: 30px; }
.word .a { color: var(--teo); } .word .b { color: var(--mil); }
.brand.big .word { font-size: 38px; }
.head-right { display: flex; align-items: center; gap: 10px; }
.today { text-align: right; font-size: 14px; color: var(--muted); }
.today strong { display: block; color: var(--ink); }
.icon-btn { width: 44px; height: 44px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); display: grid; place-items: center; }
h1 { font-family: var(--font-display); font-size: 28px; margin: 0 0 8px; }
h2 { font-family: var(--font-display); font-size: 22px; margin: 0 0 12px; }
.lead { color: var(--muted); margin: 0 0 22px; }
.panel[hidden] { display: none; }
form.add { display: flex; gap: 8px; margin-bottom: 10px; }
input[type=text], input[type=number], input[type=date], input[type=time], input[type=email], input[type=password], select {
width: 100%; min-height: 46px; padding: 0 14px; background: var(--surface); border: 1.5px solid var(--line); border-radius: 12px;
}
.btn { min-height: 46px; padding: 0 18px; border: 0; border-radius: 12px; font-weight: 600; background: var(--mil); color: var(--on-mil); }
.btn.ghost { background: transparent; color: var(--muted); border: 1.5px solid var(--line); }
.btn.danger { background: transparent; color: var(--danger); border: 1.5px solid var(--danger); }
.btn.small { min-height: 36px; padding: 0 12px; font-size: 14px; }
.btn.block { width: 100%; }
.link { background: none; border: 0; color: var(--mil); font-weight: 600; padding: 10px 0; text-decoration: underline; }
.msg { margin: 10px 0 0; font-size: 14px; color: var(--danger); word-break: break-word; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.chip { min-height: 34px; padding: 0 12px; border-radius: 999px; background: var(--surface); border: 1.5px solid var(--line); font-size: 14px; display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
.chip.selected { background: var(--mil-soft); border-color: var(--mil); font-weight: 600; }
ul.list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.row { display: flex; align-items: center; gap: 12px; background: var(--surface); border-radius: 14px; padding: 8px 8px 8px 10px; border: 1px solid var(--line); }
.check { width: 32px; height: 32px; border-radius: 10px; border: 2px solid var(--mil); background: transparent; display: grid; place-items: center; color: var(--on-mil); cursor: pointer; font-weight: bold; }
.check[aria-checked="true"] { background: var(--mil); }
.txt { flex: 1; overflow-wrap: anywhere; }
.row.done .txt { color: var(--muted); text-decoration: line-through; }
.del { border: 0; background: transparent; color: var(--muted); font-size: 22px; width: 40px; height: 40px; cursor: pointer; }
.empty { border: 1.5px dashed var(--line); border-radius: 14px; padding: 26px 18px; text-align: center; color: var(--muted); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px; margin-bottom: 18px; display: grid; gap: 12px; }
.field-label { font-size: 13px; font-weight: 600; color: var(--muted); text-transform: uppercase; margin: 0 0 6px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.code { font-family: var(--font-display); font-weight: 700; font-size: 36px; letter-spacing: 0.08em; }
nav { position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--line); padding: 8px; z-index: 5; }
.nav-in { max-width: 640px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
.tab { border: 0; background: transparent; border-radius: 12px; padding: 6px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 12px; color: var(--muted); cursor: pointer; }
.tab[aria-selected="true"] { background: var(--mil-soft); color: var(--ink); font-weight: 600; }
#toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: 86px; background: var(--ink); color: var(--bg); border-radius: 12px; padding: 10px 16px; font-size: 14px; z-index: 9; }
.ai-box { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px; margin-bottom: 16px; }
.ai-header { font-weight: 600; font-size: 14px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
</style>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
// Service Worker
if ('serviceWorker' in navigator) {
const swCode = "self.addEventListener('fetch', (e) => e.respondWith(fetch(e.request)));";

navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(() => {});
}
​// Supabase Init
const SUPABASE_URL = "https://fmyjhuzrwskalirunreb.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZteWpodXpyd3NrYWxpcnVucmViIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIzNTI4NzQsImV4cCI6MjEwNzkyODg3NH0.8yxSeNScfIEc7fvqymn9hZyQ8ispIy_zK3rgcgWVrbQ";
​const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
let fid = null, myId = null, myName = '', isReg = false;
let generatedIngredients = [];
​// Date Header Initialization
const now = new Date();
const days = ['Sonntag', 'Montag', 'Dienstag', 'Mittwoch', 'Donnerstag', 'Freitag', 'Samstag'];
document.getElementById('todayDay').textContent = days[now.getDay()];
document.getElementById('todayDate').textContent = now.toLocaleDateString('de-CH', { day: 'numeric', month: 'short' });
​function showScreen(id) {
['auth', 'family', 'app'].forEach(s => {
const el = document.getElementById('screen-' + s);
if (el) el.hidden = (s !== id);
});
}
​function switchTab(tab) {
['shop', 'todos', 'timers', 'events', 'family'].forEach(t => {
const p = document.getElementById('p-' + t);
if (p) p.hidden = (t !== tab);
const btn = document.getElementById('t-' + t);
if (btn) btn.setAttribute('aria-selected', t === tab ? 'true' : 'false');
});
}
​function toast(msg) {
const t = document.getElementById('toast');
if (t) {
t.textContent = msg;
t.hidden = false;
setTimeout(() => { t.hidden = true; }, 3000);
}
}
​// Load Data
function loadData() {
if (!fid) return;
loadList('shopping', 'list-shop', 'name');
loadList('todos', 'list-todos', 'title');
}
​function loadList(table, containerId, fieldName) {
sb.from(table).select('*').eq('family_id', fid).order('created_at', { ascending: false }).then(r => {
const el = document.getElementById(containerId);
if (!el) return;
if (r.error) {
el.innerHTML = '<div class="empty">Fehler beim Laden</div>';
return;
}
if (!r.data || r.data.length === 0) {
el.innerHTML = '<div class="empty">Keine Einträge vorhanden</div>';
return;
}
el.innerHTML = '<ul class="list">' + r.data.map(item => <li class="row ${item.done ? 'done' : ''}"> <button class="check" aria-checked="${item.done}" onclick="toggleItem('${table}', '${item.id}', ${!item.done})">${item.done ? '✓' : ''}</button> <span class="txt">${item[fieldName]}</span> <button class="del" onclick="deleteItem('${table}', '${item.id}')">×</button> </li>).join('') + '</ul>';
});
}
​window.toggleItem = (table, id, done) => {
sb.from(table).update({ done }).eq('id', id).then(() => {
loadList(table, table === 'shopping' ? 'list-shop' : 'list-todos', table === 'shopping' ? 'name' : 'title');
});
};
​window.deleteItem = (table, id) => {
sb.from(table).delete().eq('id', id).then(() => {
loadList(table, table === 'shopping' ? 'list-shop' : 'list-todos', table === 'shopping' ? 'name' : 'title');
});
};
​function route(session) {
if (!session) {
showScreen('auth');
return;
}
myId = session.user.id;
myName = session.user.user_metadata?.name || session.user.email.split('@')[0];
​sb.from('members').select('family_id, display_name, families(code)').eq('user_id', myId).maybeSingle().then(r => {
if (r.error || !r.data) {
document.getElementById('fam-hello').textContent = 'Hallo ' + myName;
showScreen('family');
return;
}
fid = r.data.family_id;
if (r.data.families) {
document.getElementById('fam-code').textContent = r.data.families.code;
}
showScreen('app');
switchTab('shop');
loadData();
}).catch(() => showScreen('auth'));
}
​// Auth Session Listeners
sb.auth.getSession().then(({ data }) => route(data.session)).catch(() => showScreen('auth'));
sb.auth.onAuthStateChange((_, session) => route(session));
​// Toggle Auth Mode
document.getElementById('auth-toggle').onclick = () => {
isReg = !isReg;
document.getElementById('auth-name-wrap').hidden = !isReg;
document.getElementById('auth-title').textContent = isReg ? 'Konto erstellen' : 'Anmelden';
document.getElementById('auth-submit').textContent = isReg ? 'Registrieren' : 'Anmelden';
document.getElementById('auth-msg').textContent = '';
};
​// Perform Login / Signup
async function handleAuth() {
const email = document.getElementById('in-email').value.trim();
const pw = document.getElementById('in-pw').value;
const name = document.getElementById('in-name').value.trim();
const msgEl = document.getElementById('auth-msg');
​if (!email || !pw) {
msgEl.textContent = 'Bitte E-Mail und Passwort eingeben.';
return;
}
msgEl.textContent = 'Verarbeite...';
​try {
let res;
if (isReg) {
res = await sb.auth.signUp({ email, password: pw, options: { data: { name } } });
} else {
res = await sb.auth.signInWithPassword({ email, password: pw });
}
​if (res.error) {
msgEl.textContent = res.error.message;
} else {
msgEl.textContent = '';
if (isReg && !res.data.session) {
toast('Registriert! Bitte E-Mail bestätigen.');
}
}
} catch (err) {
msgEl.textContent = 'Netzwerkfehler oder ungültige Eingabe.';
}
}
​document.getElementById('auth-submit').onclick = handleAuth;
​// Add Item to Shopping List
document.getElementById('btn-add-shop').onclick = () => {
const input = document.getElementById('in-shop');
const val = input.value.trim();
if (!val || !fid) return;
sb.from('shopping').insert({ family_id: fid, name: val, user_id: myId }).then(() => {
input.value = '';
loadList('shopping', 'list-shop', 'name');
});
};
​// Add Item to Todos
document.getElementById('btn-add-todo').onclick = () => {
const input = document.getElementById('in-todos');
const val = input.value.trim();
if (!val || !fid) return;
sb.from('todos').insert({ family_id: fid, title: val, user_id: myId }).then(() => {
input.value = '';
loadList('todos', 'list-todos', 'title');
});
};
​// AI Ingredient Generator Mock / Handler
document.getElementById('btn-gen-ai').onclick = () => {
const dish = document.getElementById('in-dish').value.trim();
const msgEl = document.getElementById('ai-msg');
const resultsEl = document.getElementById('ai-results');
const chipsEl = document.getElementById('ai-chips');
​if (!dish) {
msgEl.textContent = 'Bitte ein Gericht eingeben.';
return;
}
​msgEl.textContent = 'Suche Zutaten...';
resultsEl.hidden = true;
​// Simulated Smart AI ingredient detection
setTimeout(() => {
msgEl.textContent = '';
const fallbackDatabase = {
'spaghetti carbonara': ['Spaghetti 500g', 'Pancetta / Speck 150g', 'Eier 4 Stk', 'Parmesankäse', 'Schwarzer Pfeffer'],
'lasagne': ['Hackfleisch 500g', 'Lasagneplatten', 'Passierte Tomaten', 'Béchamelsauce', 'Geriebener Käse', 'Zwiebeln'],
'pizza': ['Pizzateig', 'Tomatensauce', 'Mozzarella', 'Oregano']
};
​const key = dish.toLowerCase();
const items = fallbackDatabase[key] || [
${dish} Hauptzutat, 'Salz & Pfeffer', 'Speiseöl', 'Frische Kräuter'
];
​generatedIngredients = items.map(item => ({ name: item, selected: true }));
renderAiChips();
resultsEl.hidden = false;
}, 600);
};
​function renderAiChips() {
const chipsEl = document.getElementById('ai-chips');
chipsEl.innerHTML = generatedIngredients.map((item, idx) => <div class="chip ${item.selected ? 'selected' : ''}" onclick="toggleAiChip(${idx})"> ${item.selected ? '✓' : '+'} ${item.name} </div>).join('');
}
​window.toggleAiChip = (idx) => {
generatedIngredients[idx].selected = !generatedIngredients[idx].selected;
renderAiChips();
};
​document.getElementById('btn-add-ai-selected').onclick = async () => {
const selected = generatedIngredients.filter(i => i.selected);
if (!selected.length || !fid) return;
​const rows = selected.map(i => ({ family_id: fid, name: i.name, user_id: myId }));
await sb.from('shopping').insert(rows);
​document.getElementById('ai-results').hidden = true;
document.getElementById('in-dish').value = '';
toast(${selected.length} Zutaten hinzugefügt!);
loadList('shopping', 'list-shop', 'name');
};
​// Family Setup Handlers
document.getElementById('btn-create').onclick = () => {
sb.rpc('create_family', { p_display: myName }).then(r => {
if (r.error) toast('Fehler beim Erstellen');
else sb.auth.getSession().then(({ data }) => route(data.session));
});
};
​document.getElementById('btn-join').onclick = () => {
const code = document.getElementById('in-code').value.trim();
sb.rpc('join_family', { p_code: code, p_display: myName }).then(r => {
if (r.error) document.getElementById('fam-msg').textContent = 'Ungültiger Code';
else window.location.reload();
});
};
​const logoutAction = () => sb.auth.signOut();
document.getElementById('btn-logout').onclick = logoutAction;
