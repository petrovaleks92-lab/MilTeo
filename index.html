<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F2F5FA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1424" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Milteo">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Milteo</title>

<!-- Web App Manifest für PWA Installation -->
<link rel="manifest" href='data:application/manifest+json,{
  "name": "Milteo Familienplaner",
  "short_name": "Milteo",
  "start_url": "/",
  "display": "standalone",
  "background_color": "#F2F5FA",
  "theme_color": "#1F8A4C",
  "icons": [
    {
      "src": "https://api.iconify.design/lucide:home.svg?color=%231F8A4C",
      "sizes": "192x192",
      "type": "image/svg+xml",
      "purpose": "any maskable"
    },
    {
      "src": "https://api.iconify.design/lucide:home.svg?color=%231F8A4C",
      "sizes": "512x512",
      "type": "image/svg+xml",
      "purpose": "any maskable"
    }
  ]
}'>

<link rel="icon" href="https://api.iconify.design/lucide:home.svg?color=%231F8A4C" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=DM+Sans:wght@400;500;600&display=swap">
<style>
:root {
  --bg: #F2F5FA; --surface: #FFFFFF; --ink: #16213A; --muted: #5C6884; --line: #DDE3EF;
  --mil: #1F8A4C; --on-mil: #FFFFFF; --mil-soft: #DDF3E4; --teo: #EDB800; --teo-soft: #FFF1BF;
  --danger: #B93A26; --font-display: "Bricolage Grotesque", system-ui, sans-serif; --font-body: "DM Sans", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0E1424; --surface: #172038; --ink: #EAF0FF; --muted: #9AA7C7; --line: #27324F;
    --mil: #4CD27E; --on-mil: #05210F; --mil-soft: #123A24; --teo: #F5CB3D; --teo-soft: #46391A; --danger: #FF8A75;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.4; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
.wrap, .narrow { max-width: 640px; margin: 0 auto; padding: 16px; }
.wrap { padding-bottom: 110px; }
.narrow { max-width: 440px; padding-top: 40px; }
header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
.brand { display: flex; align-items: center; gap: 10px; }
.word { font-family: var(--font-display); font-weight: 700; font-size: 30px; }
.word .a { color: var(--teo); } .word .b { color: var(--mil); }
.brand.big .word { font-size: 38px; }
.head-right { display: flex; align-items: center; gap: 10px; }
.today { text-align: right; font-size: 14px; color: var(--muted); }
.today strong { display: block; color: var(--ink); }
.icon-btn { width: 44px; height: 44px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); display: grid; place-items: center; }
h1 { font-family: var(--font-display); font-size: 28px; margin: 0 0 8px; }
h2 { font-family: var(--font-display); font-size: 22px; margin: 0 0 12px; }
.lead { color: var(--muted); margin: 0 0 22px; }
.panel[hidden] { display: none; }
form.add { display: flex; gap: 8px; margin-bottom: 10px; }
input[type=text], input[type=number], input[type=date], input[type=time], input[type=email], input[type=password], select {
  width: 100%; min-height: 46px; padding: 0 14px; background: var(--surface); border: 1.5px solid var(--line); border-radius: 12px;
}
.btn { min-height: 46px; padding: 0 18px; border: 0; border-radius: 12px; font-weight: 600; background: var(--mil); color: var(--on-mil); }
.btn.ghost { background: transparent; color: var(--muted); border: 1.5px solid var(--line); }
.btn.danger { background: transparent; color: var(--danger); border: 1.5px solid var(--danger); }
.btn.small { min-height: 36px; padding: 0 12px; font-size: 14px; }
.btn.block { width: 100%; }
.link { background: none; border: 0; color: var(--mil); font-weight: 600; padding: 10px 0; text-decoration: underline; }
.msg { margin: 8px 0 0; font-size: 14px; color: var(--danger); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
.chip { min-height: 34px; padding: 0 12px; border-radius: 999px; background: var(--surface); border: 1.5px solid var(--line); font-size: 14px; }
ul.list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.row { display: flex; align-items: center; gap: 12px; background: var(--surface); border-radius: 14px; padding: 8px 8px 8px 10px; border: 1px solid var(--line); }
.check { width: 32px; height: 32px; border-radius: 10px; border: 2px solid var(--mil); background: transparent; display: grid; place-items: center; color: var(--on-mil); }
.check[aria-checked="true"] { background: var(--mil); }
.txt { flex: 1; overflow-wrap: anywhere; }
.row.done .txt { color: var(--muted); text-decoration: line-through; }
.who { font-size: 13px; color: var(--muted); margin-left: 6px; }
.del { border: 0; background: transparent; color: var(--muted); font-size: 22px; width: 40px; height: 40px; }
.empty { border: 1.5px dashed var(--line); border-radius: 14px; padding: 26px 18px; text-align: center; color: var(--muted); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px; margin-bottom: 18px; display: grid; gap: 12px; }
.field-label { font-size: 13px; font-weight: 600; color: var(--muted); text-transform: uppercase; margin: 0 0 6px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.code { font-family: var(--font-display); font-weight: 700; font-size: 36px; letter-spacing: 0.08em; }
nav { position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--line); padding: 8px; z-index: 5; }
.nav-in { max-width: 640px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
.tab { border: 0; background: transparent; border-radius: 12px; padding: 6px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 12px; color: var(--muted); }
.tab[aria-selected="true"] { background: var(--mil-soft); color: var(--ink); font-weight: 600; }
#toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: 86px; background: var(--ink); color: var(--bg); border-radius: 12px; padding: 10px 16px; font-size: 14px; z-index: 9; }
</style>
</head>
<body>

<!-- Screens -->
<div class="screen" id="screen-auth">
  <div class="narrow">
    <div class="brand big"><div class="word"><span class="a">Mil</span><span class="b">teo</span></div></div>
    <h1 id="auth-title">Anmelden</h1>
    <p class="lead">Einkauf, Aufgaben, Timer und Termine.</p>
    <div class="card">
      <div id="auth-name-wrap" hidden>
        <label class="field-label">Dein Name</label>
        <input type="text" id="in-name">
      </div>
      <div>
        <label class="field-label">E-Mail</label>
        <input type="email" id="in-email">
      </div>
      <div>
        <label class="field-label">Passwort</label>
        <input type="password" id="in-pw">
      </div>
      <button class="btn block" type="button" id="auth-submit">Anmelden</button>
      <p class="msg" id="auth-msg"></p>
    </div>
    <button class="link" id="auth-toggle" type="button">Neu hier? Konto erstellen</button>
  </div>
</div>

<div class="screen" id="screen-family" hidden>
  <div class="narrow">
    <div class="brand big"><div class="word"><span class="a">Mil</span><span class="b">teo</span></div></div>
    <h1 id="fam-hello">Hallo</h1>
    <p class="lead">Verknüpfe dein Konto mit deiner Familie.</p>
    <div class="card">
      <button class="btn block" id="btn-create" type="button">Neue Familie erstellen</button>
    </div>
    <div class="card">
      <label class="field-label">Familiencode eingeben</label>
      <input type="text" id="in-code" placeholder="ABCD-EFGH">
      <button class="btn block" type="button" id="btn-join" style="margin-top:8px">Beitreten</button>
    </div>
    <p class="msg" id="fam-msg"></p>
    <button class="link" id="fam-logout" type="button">Abmelden</button>
  </div>
</div>

<div class="screen" id="screen-app" hidden>
  <div class="wrap">
    <header>
      <div class="brand"><div class="word"><span class="a">Mil</span><span class="b">teo</span></div></div>
      <div class="head-right">
        <div class="today"><strong id="todayDay"></strong><span id="todayDate"></span></div>
        <button class="icon-btn" id="btn-family" type="button" onclick="switchTab('family')">⚙️</button>
      </div>
    </header>

    <section class="panel" id="p-shop">
      <h2>Einkaufsliste</h2>
      <form class="add" id="f-shop" onsubmit="addShopItem(event)">
        <input type="text" id="in-shop" placeholder="Was fehlt?">
        <button class="btn" type="submit">Hinzufügen</button>
      </form>

      <!-- KI-Zutaten-Generator Box -->
      <div class="card" style="padding: 12px; margin-bottom: 12px; background: var(--mil-soft);">
        <div style="font-size: 14px; font-weight: 600; margin-bottom: 6px; color: var(--mil);">✨ Rezept-Zutaten per KI holen</div>
        <div style="display: flex; gap: 6px;">
          <input type="text" id="in-ai-dish" placeholder="Gericht (z.B. Lasagne)" style="font-size: 14px; min-height: 38px;">
          <input type="number" id="in-ai-persons" value="2" min="1" max="12" style="width: 60px; font-size: 14px; min-height: 38px;" title="Personen">
          <button type="button" class="btn small" onclick="generateAndAddIngredients()">Holen</button>
        </div>
      </div>

      <div id="list-shop"></div>
    </section>

    <section class="panel" id="p-todos" hidden>
      <h2>Aufgaben</h2>
      <form class="add" id="f-todos" onsubmit="addTodoItem(event)">
        <input type="text" id="in-todos" placeholder="Was ist zu erledigen?">
        <button class="btn" type="submit">Hinzufügen</button>
      </form>
      <div id="list-todos"></div>
    </section>

    <section class="panel" id="p-timers" hidden>
      <h2>Timer</h2>
      <div class="card">
        <form id="f-timer" class="grid2" onsubmit="startTimer(event)">
          <input type="text" id="in-tlabel" value="Backofen">
          <input type="number" id="in-tmin" value="20" min="1">
          <button class="btn block" type="submit" style="grid-column: span 2">Starten</button>
        </form>
      </div>
      <div id="list-timers"></div>
    </section>

    <section class="panel" id="p-events" hidden>
      <h2>Termine</h2>
      <div class="card">
        <form id="f-event" style="display:grid; gap:8px;" onsubmit="addEventItem(event)">
          <input type="text" id="in-etitle" placeholder="Titel">
          <div class="grid2">
            <input type="date" id="in-edate">
            <input type="time" id="in-etime">
          </div>
          <button class="btn block" type="submit">Eintragen</button>
        </form>
      </div>
      <div id="list-events"></div>
    </section>

    <section class="panel" id="p-family" hidden>
      <h2>Familie & Konto</h2>
      <div class="card">
        <p class="field-
